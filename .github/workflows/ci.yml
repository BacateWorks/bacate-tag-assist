name: CI & Publication

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore BacateTagAssist.slnx

      - name: Build Solution
        run: dotnet build BacateTagAssist.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/BacateTagAssist.Tests/BacateTagAssist.Tests.csproj -c Release --no-build --verbosity normal

  docker:
    name: Build, Validate & Publish Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image Without Cache (Validation)
        run: |
          docker build --no-cache -f docker/Dockerfile -t bacate-tag-assist:local .

      - name: Validate Container Environment
        run: |
          echo "=== 1. Validando instalacao do MediaInfo ==="
          docker run --rm bacate-tag-assist:local mediainfo --version

          echo "=== 2. Validando usuario nao-root (UID != 0) ==="
          USER_ID=$(docker run --rm bacate-tag-assist:local id -u)
          echo "Usuario em execucao UID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "ERRO: O container nao deve executar como root!"
            exit 1
          fi

          echo "=== 3. Validando leitura e escrita em /media ==="
          mkdir -p /tmp/ci_media
          chmod 777 /tmp/ci_media
          docker run --rm -v /tmp/ci_media:/media bacate-tag-assist:local sh -c "echo 'teste-escrita-media' > /media/valida.txt && cat /media/valida.txt && rm /media/valida.txt"
          rm -rf /tmp/ci_media

          echo "=== 4. Validando inicializacao e resposta HTTP 200 ==="
          mkdir -p /tmp/ci_config /tmp/ci_media
          chmod 777 /tmp/ci_config /tmp/ci_media
          docker run -d --name bta-smoke -p 5000:5000 -v /tmp/ci_config:/config -v /tmp/ci_media:/media bacate-tag-assist:local
          
          # Aguarda inicializacao
          sleep 5

          # Verifica resposta HTTP 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          echo "Status HTTP retornado: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERRO: A interface web retornou status $HTTP_STATUS ao inves de 200!"
            docker logs bta-smoke
            docker stop bta-smoke
            exit 1
          fi

          docker stop bta-smoke
          docker rm bta-smoke
          rm -rf /tmp/ci_config /tmp/ci_media

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bacateworks/bacate-tag-assist
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image (amd64 / arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
